<!DOCTYPE html>
<html>
<head>
    <title>Real-Time Poll</title>
</head>
<body>

<h2>Who is the best artist?</h2>

<div id="buttons"></div>

<h3>Results:</h3>
<ul id="results"></ul>

<script>
const pollId = "839083b2-a164-4110-9865-11b6711c2329";
const ws = new WebSocket(`ws://127.0.0.1:8000/ws/polls/${pollId}`);

const options = ["Van Gogh", "Claude Monet", "Salvador Dali"];

const buttonsDiv = document.getElementById("buttons");
const resultsList = document.getElementById("results");

options.forEach(option => {
    const btn = document.createElement("button");
    btn.innerText = option;
    btn.onclick = () => vote(option);
    buttonsDiv.appendChild(btn);
});

function vote(option) {
    ws.send(JSON.stringify({ option }));
}

function updateResults(votes) {
    resultsList.innerHTML = "";
    for (const option in votes) {
        const li = document.createElement("li");
        li.innerText = `${option}: ${votes[option]}`;
        resultsList.appendChild(li);
    }
}

ws.onopen = () => {
    console.log("Connected");
};

ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === "vote_update") {
        updateResults(data.votes);
    }
};

ws.onclose = () => {
    console.log("Disconnected");
};
</script>

</body>
</html>
